name: IR Document Tracker

on:
  schedule:
    - cron: "30 7 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no downloads, no notifications)"
        type: boolean
        default: false
  push:
    branches: [main, cloudfront-refactor]

jobs:
  scan:
    name: Scan IR Pages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt


      - name: Run IR scan
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
          NOTIFY_EMAIL_FROM: ${{ secrets.NOTIFY_EMAIL_FROM }}
          NOTIFY_EMAIL_PASS: ${{ secrets.NOTIFY_EMAIL_PASS }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python main.py --dry-run --output-json new_docs.json
          else
            python main.py --output-json new_docs.json
          fi

      - name: Show results summary
        run: python summarize.py

      - name: Commit updated state
        run: |
          git config user.name "ir-tracker[bot]"
          git config user.email "ir-tracker[bot]@users.noreply.github.com"
          git add state.json
          if git diff --staged --quiet; then
            echo "No state changes to commit"
          else
            git commit -m "chore: update scan state [skip ci]"
            git push
          fi

      - name: Upload documents as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ir-documents-${{ github.run_id }}
          path: downloads/
          retention-days: 90
          if-no-files-found: ignore
